; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; -----------------------------------------------------------------------------
; 目录约定 (重要):
;   src/      Arduino setup()/loop(); pio run 默认源
;   lib/      第三方与本项目模块 (ble / button / cnn / imu / led / ...)
;             由 PlatformIO LDF 自动扫描并编译进固件.
;   include/  公共头, 含 protocol_config.h (由 scripts/gen_protocol_config.py
;             从 config/protocol.json 构建期生成).
;   test/     **本地单元测试** (Linux g++ + CMake, 见 test/README.md).
;             pio run 不会编译 test/, 它只在 pio test 时被 PlatformIO Test
;             Runner 接管. 本项目的 test/ 改用本机 CMake 直接构建运行,
;             因此 pio test 也不应在 test/ 上调用. 详见 test/run.sh.
;
; 验证 "test 代码不进固件" 的契约:
;   bash scripts/verify_firmware_clean.sh
; -----------------------------------------------------------------------------

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
build_flags = 
    -Iinclude
    -Ilib/cnn/nnom_lib/inc
	-Ilib/cnn/nnom_lib/port
	-Wno-narrowing
lib_deps = 
	electroniccats/MPU6050@^1.4.4
extra_scripts = pre:scripts/gen_protocol_config.py

