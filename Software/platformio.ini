; PlatformIO Project Configuration File (snake_temp 分支)
; -----------------------------------------------------------------------------
; CyberWand: ESP32-S3 N16R8 开发板 + MPU6050 + 触摸开关 + 普通 GPIO LED
; 框架: 纯 ESP-IDF (无 Arduino 组件层)
; -----------------------------------------------------------------------------
[env:cyberwand]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf, arduino

monitor_speed = 115200
upload_speed  = 460800

build_flags =
    -Wno-error
    -Wno-narrowing
    -Wno-return-type
    -Wno-misleading-indentation
    -Wno-unused-variable
    -Wno-unused-but-set-variable
    -Wno-unused-function

extra_scripts =
    pre:scripts/gen_protocol_config.py
    pre:scripts/patch_werror.py