; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; -----------------------------------------------------------------------------
; 目录约定 (重要):
;   src/      Arduino setup()/loop(); pio run 默认源
;   lib/      第三方与本项目模块 (ble / button / cnn / imu / led / ...)
;             由 PlatformIO LDF 自动扫描并编译进固件.
;   include/  公共头, 含 protocol_config.h (由 scripts/gen_protocol_config.py
;             从 config/protocol.json 构建期生成).
;   test/     **本地单元测试** (Linux g++ + CMake, 见 test/README.md).
;             pio run 不会编译 test/, 它只在 pio test 时被 PlatformIO Test
;             Runner 接管. 本项目的 test/ 改用本机 CMake 直接构建运行,
;             因此 pio test 也不应在 test/ 上调用. 详见 test/run.sh.
;
; 验证 "test 代码不进固件" 的契约:
;   bash scripts/verify_firmware_clean.sh
; -----------------------------------------------------------------------------

; =============================================================================
; CyberWand 主固件目标: ESP32-S3-WROOM-1-N16R8
;   16 MB Flash + 8 MB Octal SPI PSRAM
;   板载 PCB 天线, BLE 5.0 + WiFi 4
; -----------------------------------------------------------------------------
; N16R8 关键: 必须设置 board_build.arduino.memory_type = qio_opi 才能启用
;             Octal PSRAM, 否则 PSRAM 用不了, 而且 IO26~IO37 这 12 个引脚
;             也不能当普通 GPIO 用 (会让 PSRAM 总线崩溃).
;             见 include/board_config.h 里的 static_assert.
; -----------------------------------------------------------------------------
; LED1 是 WS2812B 智能 LED, 不是普通 GPIO LED, 用 Adafruit NeoPixel 驱动.
; -----------------------------------------------------------------------------
[env:cyberwand]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- N16R8 内存配置 ---
board_build.arduino.memory_type = qio_opi      ; 启用 8MB Octal PSRAM
board_build.flash_mode  = qio                  ; QSPI Flash 模式
board_build.flash_size  = 16MB                 ; 16MB Flash 完整使用
board_build.partitions  = partitions_16MB.csv  ; 自定义 16MB OTA 双分区表

; --- 串口 / 烧录 ---
monitor_speed = 115200
upload_speed  = 921600

; esp32-s3-devkitc-1 板模板默认设 -DARDUINO_USB_MODE=1 和 -DARDUINO_USB_CDC_ON_BOOT=1
; 本板用外置 CH340 转串口 (不用内置 USB-Serial-JTAG), 必须先 unflag 再覆盖,
; 否则每个 .cpp 都会刷一遍 "warning: ARDUINO_USB_MODE redefined".
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

build_flags =
    -Iinclude
    -Ilib/cnn/nnom_lib/inc
    -Ilib/cnn/nnom_lib/port
    -Wno-narrowing
    -DBOARD_HAS_PSRAM                          ; 让 ESP.getPsramSize() 等 API 工作
    -DARDUINO_USB_CDC_ON_BOOT=0                ; 用外部 CH340, 不用内置 USB-Serial-JTAG
    -DARDUINO_USB_MODE=0
    -DCORE_DEBUG_LEVEL=3                       ; ARDUHAL_LOG_LEVEL_INFO
    -DFEATURE_GESTURE_RECORDING                ; 启用双击->四元数录制模式 (与 Acquisition 互斥)
    -DCONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=1   ; OTA 回滚保护

lib_deps =
    electroniccats/MPU6050@^1.4.4              ; 实物 IMU 若是 ICM 系列, 见 lib/imu 适配
    adafruit/Adafruit NeoPixel@^1.12.0         ; WS2812B 驱动 (RMT 时序)

extra_scripts = pre:scripts/gen_protocol_config.py

