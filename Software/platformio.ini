; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; -----------------------------------------------------------------------------
; 目录约定 (重要):
;   src/      Arduino setup()/loop(); pio run 默认源
;   lib/      第三方与本项目模块 (ble / button / cnn / imu / led / ...)
;             由 PlatformIO LDF 自动扫描并编译进固件.
;   include/  公共头, 含 protocol_config.h (由 scripts/gen_protocol_config.py
;             从 config/protocol.json 构建期生成).
;   test/     **本地单元测试** (Linux g++ + CMake, 见 test/README.md).
;             pio run 不会编译 test/, 它只在 pio test 时被 PlatformIO Test
;             Runner 接管. 本项目的 test/ 改用本机 CMake 直接构建运行,
;             因此 pio test 也不应在 test/ 上调用. 详见 test/run.sh.
;
; 验证 "test 代码不进固件" 的契约:
;   bash scripts/verify_firmware_clean.sh
; -----------------------------------------------------------------------------

; =============================================================================
; CyberWand 临时开发板方案 (snake_temp 分支)
;   硬件: ESP32-S3 N16R8 开发板 + MPU6050 模块 + 触摸开关
;   与主分支 (snake_master) 的区别:
;     - 主分支: 自制 PCB (ESP32-S3 + IMU + 按键 + WS2812B + 充电管理)
;     - 临时分支: 通用开发板 + 外接模块 (无 PSRAM / 无 WS2812B LED / 无充电检测)
;   ⚠️ 临时禁用 PSRAM: 开发板 PSRAM 初始化导致 boot loop,
;      N16R8 的 PSRAM (Octal 8MB) 需要 qio_opi 模式,
;      但当前 Arduino-ESP32 框架在启动早期初始化 PSRAM 时崩溃.
;      等 PCB 做好后再在主分支恢复 PSRAM.
; -----------------------------------------------------------------------------
[env:cyberwand]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- 内存 / Flash 配置 ---
; 临时禁用 PSRAM, 避免 boot loop. 正式 PCB 上用 qio_opi (Octal PSRAM)
board_build.flash_mode  = qio
board_build.flash_size  = 16MB
board_build.partitions  = default_16MB.csv

; --- 串口 / 烧录 ---
; 开发板通过外接 USB-UART 模块连接电脑 (TX=GPIO43, RX=GPIO44)
monitor_speed = 115200
upload_speed  = 460800

; esp32-s3-devkitc-1 模板默认启用内置 USB-Serial-JTAG, 我们用外接 UART 模块,
; 必须关闭内置 USB CDC 避免编译警告和端口冲突.
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

build_flags =
    -Iinclude
    -Ilib/cnn/nnom_lib/inc
    -Ilib/cnn/nnom_lib/port
    -Wno-narrowing
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    electroniccats/MPU6050@^1.4.4
    adafruit/Adafruit NeoPixel@^1.12.0

extra_scripts = pre:scripts/gen_protocol_config.py

