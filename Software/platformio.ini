; PlatformIO Project Configuration File (snake_temp 分支)
; -----------------------------------------------------------------------------
; CyberWand 临时开发板方案:
;   硬件: ESP32-S3 N16R8 开发板 + MPU6050 模块 + 触摸开关
;   框架: ESP-IDF + Arduino 组件 (参照 InstaFreeLink 已验证配置)
;
; 主分支 (snake_master): framework = arduino (未来自制 PCB 用)
; 临时分支 (snake_temp):   framework = espidf, arduino (开发板验证用)
; -----------------------------------------------------------------------------
[env:cyberwand]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf, arduino

monitor_speed = 115200
upload_speed  = 460800

build_flags =
    -Iinclude
    -Ilib/cnn/nnom_lib/inc
    -Ilib/cnn/nnom_lib/port
    -Wno-narrowing
    -Wno-return-type
    -Wno-misleading-indentation
    -Wno-unused-variable
    -Wno-unused-but-set-variable
    -DARDUINO_VARIANT=esp32s3
    -DBOARD_HAS_PSRAM

lib_deps =
    electroniccats/MPU6050@^1.4.4
    adafruit/Adafruit NeoPixel@^1.12.0

extra_scripts = pre:scripts/gen_protocol_config.py