; PlatformIO Project Configuration File (snake_temp 分支)
; -----------------------------------------------------------------------------
; CyberWand: ESP32-S3 N16R8 开发板 + MPU6050 + 触摸开关 + 普通 GPIO LED
; 框架: 纯 ESP-IDF (无 Arduino 组件层)
; -----------------------------------------------------------------------------
[env:cyberwand]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf, arduino

; --- N16R8 内存与 Flash 配置 (16MB Boya Flash + 8MB Octal PSRAM) ---
board_build.arduino.memory_type = qio_opi
board_build.flash_mode  = qio
board_build.flash_size  = 16MB
board_upload.flash_size  = 16MB
board_build.partitions  = partitions_16MB.csv

monitor_speed = 115200
upload_speed  = 460800

build_flags =
    -Iinclude
    -Ilib/cnn/nnom_lib/inc
    -Ilib/cnn/nnom_lib/port
    -Wno-error
    -Wno-narrowing
    -Wno-return-type
    -Wno-misleading-indentation
    -Wno-unused-variable
    -Wno-unused-but-set-variable
    -Wno-unused-function
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -DCORE_DEBUG_LEVEL=3

; esp32-s3-devkitc-1 默认设 -DARDUINO_USB_MODE=1 / -DARDUINO_USB_CDC_ON_BOOT=1,
; 本板用外置 FTDI FT232 (VID:PID=0403:6001) 接 UART0, 必须先 unflag 再覆盖
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

extra_scripts =
    pre:scripts/gen_protocol_config.py
    pre:scripts/patch_werror.py

lib_deps =
    electroniccats/MPU6050@^1.4.4
    adafruit/Adafruit NeoPixel@^1.12.0