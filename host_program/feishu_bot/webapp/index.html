<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberWand 控制器</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }
    .container {
      text-align: center;
      background: rgba(255,255,255,0.1);
      padding: 40px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }
    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }
    .subtitle {
      font-size: 16px;
      opacity: 0.9;
      margin-bottom: 30px;
    }
    .feature-list {
      text-align: left;
      margin: 30px 0;
    }
    .feature-item {
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }
    .feature-item:last-child {
      border-bottom: none;
    }
    .status {
      margin-top: 20px;
      padding: 15px;
      background: rgba(0,0,0,0.2);
      border-radius: 10px;
    }
    .btn {
      background: white;
      color: #667eea;
      padding: 12px 30px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
    }
    .btn:hover {
      background: #f0f0f0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🪄 CyberWand 控制器</h1>
    <div class="subtitle">赛博魔杖上位机配置工具</div>
    
    <div class="feature-list">
      <div class="feature-item">✅ 蓝牙扫描与连接</div>
      <div class="feature-item">✅ 动作映射配置</div>
      <div class="feature-item">✅ 姿态参数调整</div>
      <div class="feature-item">✅ 传感器数据实时监控</div>
    </div>
    
    <div class="status">
      <strong>当前状态:</strong> <span id="status-text">准备就绪</span>
    </div>
    
    <button class="btn" onclick="checkStatus()">检查设备状态</button>
  </div>
  
  <script>
    function checkStatus() {
      document.getElementById('status-text').textContent = '正在检查...';
      setTimeout(() => {
        document.getElementById('status-text').textContent = '设备已连接（模拟）';
      }, 1000);
    }
  </script>
</body>
</html>
